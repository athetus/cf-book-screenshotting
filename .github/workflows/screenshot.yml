name: screenshot

on:
  schedule:
    # Hourly. Minute 35 avoids GitHub's busiest minute (:00, where scheduled
    # runs are often dropped) and lands inside the same Asia/Kolkata hour as
    # an external trigger at :40. Each finished chunk leaves a marker in Drive
    # for its local hour and later runs skip it, so both triggers can stay on.
    - cron: "35 * * * *"
    # Weekly keepalive (see the keepalive job): GitHub switches off scheduled
    # workflows in public repos after 60 days without repository activity.
    - cron: "50 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if this hour's chunks are already done"
        type: boolean
        default: false

# One run at a time; a newer trigger waits instead of overlapping.
concurrency:
  group: screenshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keepalive:
    # Re-enabling the workflow through the API stops GitHub's 60-day
    # inactivity switch-off (same call as liskin/gh-workflow-keepalive).
    if: github.event_name == 'schedule' && github.event.schedule == '50 3 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/screenshot.yml/enable"

  dispatch:
    # The weekly keepalive schedule only re-enables the workflow.
    if: github.event.schedule != '50 3 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      has_jobs: ${{ steps.compute.outputs.has_jobs }}
      problems: ${{ steps.compute.outputs.problems }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Write service account credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/credentials.json"
      - name: Compute active jobs
        id: compute
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/credentials.json
          CONTROL_SHEET_ID: ${{ secrets.CONTROL_SHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FORCE_RERUN: ${{ inputs.force }}
        run: python screenshot_runner.py dispatch
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/credentials.json"

  run:
    needs: dispatch
    if: needs.dispatch.outputs.has_jobs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        job: ${{ fromJSON(needs.dispatch.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Write service account credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/credentials.json"
      - name: Process sheet chunk
        env:
          # Passed through env, never pasted into the shell script, so sheet
          # data can't inject commands.
          MATRIX_JOB: ${{ matrix.job }}
          FORCE_RERUN: ${{ inputs.force }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/credentials.json
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python screenshot_runner.py run
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/credentials.json"

  alert:
    # Catches failures the Python code can't report itself (install steps,
    # a crashed job, a timeout).
    needs: [dispatch, run]
    # Also alert when dispatch hit a problem but other work still ran (a run
    # that is otherwise green).
    if: failure() || needs.dispatch.outputs.problems == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "No SLACK_WEBHOOK_URL secret; skipping"; exit 0; fi
          payload=$(python3 -c 'import json,os; print(json.dumps({"text": ":rotating_light: Screenshot run failed or hit a problem: " + os.environ["RUN_URL"]}))')
          curl --fail --retry 3 --retry-all-errors -sS -m 20 -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
